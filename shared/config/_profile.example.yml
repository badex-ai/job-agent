# shared/config/_profile.example.yml
# A made-up candidate showing every field. Copy this file to _profile.yml
# (gitignored) and replace the values with your own. Sections 1-9 are the
# v1 interview answers (`python v1/setup_profile.py` can write them); the
# gate and search settings at the bottom are edited by hand.

# SECTION 1: WORK PERSONALITY
work_style: "Plan first, then iterate in small steps"
pace_preference: "Steady, with short feedback loops"
team_environment: "Small remote team with clear ownership"

# SECTION 2: MOTIVATIONS & VALUES
top_motivations:
  - "learning"
  - "ownership"
core_values: |
  Clear writing, honest estimates, leaving code better than I found it
pride_moment: |
  Replaced a nightly batch import that failed silently with an idempotent
  job that reports what it skipped and why.

# SECTION 3: UNIQUE STRENGTHS
superpower: "Finding the one log line that explains an outage"
unique_background: |
  Came to backend work from logistics operations, so I read a shipping
  manifest before I read the schema.
proof_points:
  - "Cut a payment reconciliation job from 40 minutes to 6"
  - "Wrote the on-call runbook the team still uses"
technical_strengths: |
  Go and Python services, PostgreSQL, queue-based workers, observability

# SECTION 4: DEAL BREAKERS
work_that_drains: |
  Rewrites with no owner, meetings without decisions
deal_breakers:
  - "unpaid or equity-only roles"
  - "explicit 'no sponsorship / must have work authorization'"
skills_to_avoid: "COBOL, mainframe"

# SECTION 5: CAREER GOALS
career_goal_2_years: |
  Own a backend service end to end, from schema to on-call.
level_goal: "IC (Individual Contributor, stay hands-on)"
learning_goals: |
  Distributed tracing, database internals

# SECTION 6: INTERVIEW STORIES (STAR Format)
interview_stories:
  - |
    **Situation:** Orders were double-charged when the payment provider retried.
    **Task:** Make the charge endpoint safe to retry.
    **Action:** Added idempotency keys and a unique constraint, replayed a week
    of provider logs against staging.
    **Result:** No duplicate charges since release.
    **Reflection:** The database constraint did more than the application check.

# SECTION 7: COMPENSATION & LOGISTICS
salary_min: "40000"
salary_target: "55000"
remote_requirement: "Full remote (non-negotiable)"
relocation: "No"

# SECTION 8: PERSONALITY TRAITS
personality_strengths: "Patient debugger, careful reviewer"
growth_areas: "Speaking up earlier in design reviews"
conflict_resolution: |
  Ask what the other person is optimising for, then argue from data.

# SECTION 9: PROFESSIONAL NARRATIVE
elevator_pitch: |
  Backend engineer who builds services that are boring to operate.
career_arc: |
  Logistics operations, then internal tooling, then backend services.

# --- Gate settings (read by v2/gate_prompt.py and v2/hard_gates.py) ---
location: "Bogotá, Colombia"
country: "Colombia"
# What you would actually take a job in — not everything your CV mentions.
stack: >-
  Go and Python backend services, PostgreSQL, Docker; some React for
  internal tools.
# Tokens the gate looks for in a requirement list before calling it wrong-stack.
stack_keywords: [Go, Golang, Python, PostgreSQL, Docker, React]
# A role whose PRIMARY language is one of these is a wrong-stack skip.
not_stack: [Java, "C#", .NET, PHP, Ruby]
wrong_fields: >-
  data science, mobile, QA, UI/UX-led, DevRel, scrum
priority_roles: >-
  a backend or platform IC role in Go or Python
# Places whose jobs are skipped outright (rule S5); empty for none.
excluded_locations: []
# Regex safety net in front of the model: india, inr_salary, unpaid, no_sponsorship.
hard_gates: [unpaid, no_sponsorship]

# --- Search settings (read by shared/config) ---
job_types:
  backend:
    keywords: [backend engineer, golang developer, python backend]
    cv_file: data/cv_backend.txt
# [country, results_wanted, remote_only]
indeed_passes:
  - [colombia, 25, false]
  - [usa, 20, true]
